[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "velov"
version = "1.0.0"
description = "Fil rouge du cours Industrialisation de l'IA dans le Cloud : prédiction de disponibilité Vélo'v"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error",
    # Dépréciation SQLAlchemy 2.1 déclenchée par les modèles internes de MLflow 3.16.1 (registre SQLite des tests).
    # Pas notre code ; à retirer quand MLflow aura migré.
    "ignore:The ``noload`` loader strategy is deprecated:DeprecationWarning",
    # Avertissement émis par le wrapper pyfunc de sklearn dans MLflow 3.16.1 lui-même (annotations de son code).
    "ignore:.*Any type hint is inferred as AnyType:UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert autorisé dans les tests

[tool.ruff.lint.per-file-ignores]
"exercices/**" = ["S"]
